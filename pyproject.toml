[project]
name = "leasedd"
version = "0.1.0"
description = "Local multi-user lease due diligence workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.34,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.10,<3",
    "python-multipart>=0.0.20,<0.1",
    "python-docx>=1.1,<2",
    "docxtpl>=0.20,<0.21",
    "httpx>=0.28,<0.29",
    "alembic>=1.15,<2",
    "markitdown[docx,xlsx]>=0.1.6,<0.2",
    "playwright>=1.50,<2",
]
[dependency-groups]
dev = ["pytest>=8,<9", "playwright>=1.50,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/leasedd"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
